<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document Routing and Tracking System</title>
  <!--
    GITHUB PAGES EMBED
    1. I-deploy muna ang app sa Apps Script (Deploy > New deployment > Web app).
    2. Palitan ang value ng APP_URL sa baba ng iyong /exec URL.
    3. I-commit ang file na ito sa GitHub repo mo, tapos i-enable ang
       Settings > Pages (branch: main, folder: / (root)).
  -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0b2a55; }
    .frame-wrap { position: fixed; inset: 0; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .fallback {
      position: fixed; inset: 0; display: none; place-items: center;
      color: #fff; font-family: "Segoe UI", Arial, sans-serif; text-align: center; padding: 24px;
    }
    .fallback a { color: #9fc1f5; }
  </style>
<base target="_blank">
</head>
<body>
  <div class="frame-wrap">
    <iframe id="appFrame"
            src="https://script.google.com/macros/s/AKfycbzAfBtbI0Hk2noo2qT_4V9SBvG-Yhpv7NrTgO67IEyEBmWHU1pgachwGKkbCB6eYvq5/exec"
               
            allow="clipboard-read; clipboard-write"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
  <div class="fallback" id="fallback">
    <div>
      <h1>Document Routing and Tracking System</h1>
      
      <a href="https://script.google.com/macros/s/AKfycbzAfBtbI0Hk2noo2qT_4V9SBvG-Yhpv7NrTgO67IEyEBmWHU1pgachwGKkbCB6eYvq5/exec" target="_blank" rel="noopener"></a></p>
    </div>
  </div>
  <script>
    
    (function () {
      var f = document.getElementById('appFrame');
      setTimeout(function () {
        try {
          if (!f.contentWindow || f.contentWindow.length === 0 && f.contentDocument === null) {
            document.getElementById('fallback').style.display = 'grid';
          }
        } catch (e) {
          // Cross-origin: hindi natin mabasa ang loob, normal ito kapag gumagana ang iframe.
        }
      }, 5000);
    })();
  </script>
</body>
</html>
